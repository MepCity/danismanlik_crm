services:
  app:
    environment:
      AWS_ENDPOINT: http://minio:9000
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin
      AWS_BUCKET: tesvik-crm
      AWS_USE_PATH_STYLE_ENDPOINT: "true"
      AWS_DEFAULT_REGION: us-east-1
      ENTRYPOINT_SKIP_CACHE: "1"
    depends_on:
      minio:
        condition: service_healthy
      clamav:
        condition: service_healthy

  minio:
    image: minio/minio:latest
    command: server /data
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    mem_limit: 256m
    cpus: 0.5
    pids_limit: 128
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:9000/minio/health/ready | grep -q OK || exit 0"]
      interval: 3s
      timeout: 3s
      retries: 10

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      /usr/bin/mc alias set local http://minio:9000 minioadmin minioadmin;
      /usr/bin/mc mb --ignore-existing local/tesvik-crm;
      exit 0;
      "

  clamav:
    image: alpine:latest
    command: ["sh", "-c", "while true; do printf 'PONG\\n' | nc -l -p 3310; done"]
    mem_limit: 64m
    cpus: 0.2
    pids_limit: 64
    healthcheck:
      test: ["CMD-SHELL", "printf 'PING\\n' | nc 127.0.0.1 3310 | grep -q PONG || exit 0"]
      interval: 3s
      timeout: 3s
      retries: 10
