# Teşvik CRM — Nginx vhost (PHP-FPM upstream app:9000)
#
# Klasik Laravel yapılandırması: public/ altında tüm istekler index.php'ye
# yönelir; statik dosyalar doğrudan servis edilir.

upstream php-fpm {
    server app:9000;
}

server {
    listen       80;
    listen       [::]:80;
    server_name  _;
    root         /var/www/html/public;
    index        index.php;

    charset      utf-8;
    client_max_body_size 25M;

    # Statik dosya önbellekleme (asset'ler).
    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Yüklenen evrakları proxy'lerken zaman aşımı.
    location = /index.php {
        try_files $uri =404;
        fastcgi_pass   php-fpm;
        fastcgi_index  index.php;
        fastcgi_param  SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include        fastcgi_params;
        fastcgi_read_timeout 60;
    }

    # .php dışında diğer php dosyalarına doğrudan erişimi engelle.
    location ~ \.php$ {
        return 404;
    }

    # Gizli dosyalar.
    location ~ /\.(?!well-known).* {
        deny all;
    }
}
