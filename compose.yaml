# Teşvik CRM — geliştirme ortamı (Docker Compose)
#
# Kullanım:  make up   (ya da   docker compose up -d)
# Tüm host portları .env üzerinden değiştirilebilir; yoksa varsayılanlar geçerli.
#
# Servisler:
#   app        PHP 8.4-FPM, uygulama (kendi Dockerfile'ı)
#   web        Nginx, app:9000'ye proxy; host portu ${WEB_PORT:-8088}
#   db         PostgreSQL 17, named volume, host portu ${PUBLISH_DB_PORT:-55432}
#   redis      kuyruk + önbellek
#   minio      S3 uyumlu, başlangıç bucket'ı minio-init tarafından oluşturulur
#   minio-init tek seferlik: bucket oluştur + public read
#   mailpit    giden e-postaları yakalar
#   queue      app imajı, queue:work
#   scheduler  app imajı, schedule:work

name: tesvik-crm

x-app-build: &app-build
  context: .
  dockerfile: docker/app/Dockerfile
  target: dev
  args:
    USER_ID: ${USER_ID:-1000}
    GROUP_ID: ${GROUP_ID:-1000}

x-app-env: &app-env
  # PHP uygulaması ortam değişkenleri .env dosyasından (Laravel) okunur; burada
  # yalnızca container'ın PHP davranışını etkileyen değerler var.
  PHP_IDE_CONFIG: serverName=tesvik-crm

services:
  app:
    build:
      <<: *app-build
    image: tesvik-crm/app:dev
    container_name: tesvik-crm-app
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html
    environment:
      <<: *app-env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  web:
    image: nginx:stable
    container_name: tesvik-crm-web
    volumes:
      - ./docker/web/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./public:/var/www/html/public:ro
    ports:
      - "${PUBLISH_HOST:-127.0.0.1}:${WEB_PORT:-8088}:80"
    depends_on:
      - app
    restart: unless-stopped

  db:
    image: postgres:17-alpine
    container_name: tesvik-crm-db
    environment:
      POSTGRES_DB: ${DB_DATABASE:-tesvik_crm}
      POSTGRES_USER: ${DB_USERNAME:-tesvik}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-tesvik}
      POSTGRES_HOST_AUTH_METHOD: scram-sha-256
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256"
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "${PUBLISH_HOST:-127.0.0.1}:${PUBLISH_DB_PORT:-55432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-tesvik} -d ${DB_DATABASE:-tesvik_crm}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: tesvik-crm-redis
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    # Host'a yayınlanmaz: uygulama compose ağı üzerinden `redis` servis adıyla
    # bağlanır. Bu makinede 6379 hostta yerel redis-server'da kullanımda olduğu
    # için çakışmayı önlemek amacıyla da yayınlanmaz. Gerekirse host erişimi
    # için PUBLISH_REDIS_PORT açıp aşağıdaki satırı açın.
    # ports:
    #   - "${PUBLISH_HOST:-127.0.0.1}:${PUBLISH_REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    container_name: tesvik-crm-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    volumes:
      - miniodata:/data
    ports:
      - "${PUBLISH_HOST:-127.0.0.1}:${PUBLISH_MINIO_S3_PORT:-9000}:9000"
      - "${PUBLISH_HOST:-127.0.0.1}:${PUBLISH_MINIO_CONSOLE_PORT:-9001}:9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  minio-init:
    image: minio/mc:latest
    container_name: tesvik-crm-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${MINIO_ROOT_USER:-minioadmin} ${MINIO_ROOT_PASSWORD:-minioadmin} &&
      mc mb --ignore-existing local/${MINIO_BUCKET:-tesvik-crm} &&
      echo 'bucket hazır (private): ${MINIO_BUCKET:-tesvik-crm}'
      "
    restart: "no"

  db-init:
    # Tek seferlik: geliştirme sunucusunda ayrı test veritabanı oluştur.
    # Testler gerçek PostgreSQL'e karşı koşar (SQLite değil); geliştirme
    # verisi tesvik_crm'de kalır, testler tesvik_crm_test'te izole çalışır.
    image: postgres:17-alpine
    container_name: tesvik-crm-db-init
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGUSER: ${DB_USERNAME:-tesvik}
      PGDATABASE: ${DB_DATABASE:-tesvik_crm}
      PGHOST: db
      PGPASSWORD: ${DB_PASSWORD:-tesvik}
    entrypoint: >
      /bin/sh -c "
      psql -tc \"SELECT 1 FROM pg_database WHERE datname = '${DB_DATABASE_TEST:-tesvik_crm_test}'\" | grep -q 1 ||
      psql -c \"CREATE DATABASE ${DB_DATABASE_TEST:-tesvik_crm_test}\" &&
      echo 'test veritabanı hazır: ${DB_DATABASE_TEST:-tesvik_crm_test}'
      "
    restart: "no"

  mailpit:
    image: axllent/mailpit:latest
    container_name: tesvik-crm-mailpit
    ports:
      - "${PUBLISH_HOST:-127.0.0.1}:${PUBLISH_MAILPIT_SMTP_PORT:-1025}:1025"
      - "${PUBLISH_HOST:-127.0.0.1}:${PUBLISH_MAILPIT_WEB_PORT:-8025}:8025"
    restart: unless-stopped

  queue:
    build: *app-build
    image: tesvik-crm/app:dev
    container_name: tesvik-crm-queue
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html
    environment:
      <<: *app-env
    entrypoint: ["/usr/local/bin/entrypoint.sh"]
    command: ["php", "artisan", "queue:work", "redis", "--tries=3", "--timeout=90"]
    depends_on:
      app:
        condition: service_started
      redis:
        condition: service_healthy
    restart: unless-stopped

  scheduler:
    build: *app-build
    image: tesvik-crm/app:dev
    container_name: tesvik-crm-scheduler
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html
    environment:
      <<: *app-env
    entrypoint: ["/usr/local/bin/entrypoint.sh"]
    command: ["php", "artisan", "schedule:work"]
    depends_on:
      app:
        condition: service_started
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
  miniodata:
