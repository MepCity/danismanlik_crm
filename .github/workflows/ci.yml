name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    name: quality
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: tesvik_crm_test
          POSTGRES_USER: tesvik
          POSTGRES_PASSWORD: tesvik
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tesvik -d tesvik_crm_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      mailpit:
        image: axllent/mailpit:latest
        ports:
          - 1025:1025
          - 8025:8025

    env:
      APP_ENV: testing
      APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      APP_LOCALE: tr
      APP_TIMEZONE: Europe/Istanbul
      DB_CONNECTION: testing
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_DATABASE_TEST: tesvik_crm_test
      DB_USERNAME: tesvik
      DB_PASSWORD: tesvik
      REDIS_HOST: 127.0.0.1
      REDIS_PORT: 6379
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin
      AWS_DEFAULT_REGION: us-east-1
      AWS_BUCKET: tesvik-crm
      AWS_USE_PATH_STYLE_ENDPOINT: true
      AWS_ENDPOINT: http://127.0.0.1:9000
      DOCUMENT_DISK: s3
      MAIL_HOST: 127.0.0.1

    steps:
      - name: Kodu al
        uses: actions/checkout@v6

      - name: PHP kur
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, intl, pdo_pgsql, redis, zip
          coverage: none

      - name: MinIO başlat ve kovayı hazırla
        run: |
          docker run --detach --name minio \
            --publish 9000:9000 \
            --env MINIO_ROOT_USER=minioadmin \
            --env MINIO_ROOT_PASSWORD=minioadmin \
            minio/minio:latest server /data
          for attempt in {1..30}; do
            curl --fail --silent http://127.0.0.1:9000/minio/health/ready && break
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:9000/minio/health/ready
          docker run --rm --network host \
            --env MC_HOST_local=http://minioadmin:minioadmin@127.0.0.1:9000 \
            minio/mc:latest mb --ignore-existing local/tesvik-crm

      - name: Node kur
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Composer önbellek dizinini bul
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Composer önbelleğini yükle
        uses: actions/cache@v5
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-php-8.4-composer-${{ hashFiles('composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-php-8.4-composer-

      - name: Bağımlılıkları kur
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Ön yüz bağımlılıklarını kur
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Ön yüz varlıklarını derle
        run: npm run build

      - name: Pint
        run: vendor/bin/pint --test

      - name: Larastan
        run: vendor/bin/phpstan analyse --memory-limit=512M

      - name: Pest
        run: php artisan test

  staging-verification:
    name: staging-verification
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Kodu al
        uses: actions/checkout@v6

      - name: Staging Compose (tünelsiz) config testi
        run: |
          STAGING_ENV_FILE=.env.staging.example DB_PASSWORD=testpass REDIS_PASSWORD=testpass \
            docker compose --env-file .env.staging.example -f compose.staging.yaml config --quiet

      - name: Tünel override token eksikken kırmızıya düşme testi (fail-fast)
        run: |
          if STAGING_ENV_FILE=.env.staging.example DB_PASSWORD=testpass REDIS_PASSWORD=testpass \
            docker compose --env-file .env.staging.example -f compose.staging.yaml -f compose.staging.tunnel.yaml config --quiet; then
            echo "HATA: Tünel tokenı olmadan komut başarılı olmamalıydı!"
            exit 1
          else
            echo "Tünel override'ı token eksikliğinde beklendiği gibi hata verdi."
          fi

      - name: Tünel override token verildiğinde başarılı olma testi
        run: |
          CLOUDFLARE_TUNNEL_TOKEN=test-token STAGING_ENV_FILE=.env.staging.example DB_PASSWORD=testpass REDIS_PASSWORD=testpass \
            docker compose --env-file .env.staging.example -f compose.staging.yaml -f compose.staging.tunnel.yaml config --quiet

      - name: Production Web ve App Docker imajlarını derle
        run: |
          docker build --target prod -f docker/app/Dockerfile -t bizlife-crm-app:staging-test .
          docker build --target web-prod -f docker/app/Dockerfile -t bizlife-crm-web:staging-test .

      - name: Build edilmiş app imajında entrypoint staging ve production olumlu testleri
        run: |
          # Staging olumlu
          docker run --rm \
            -e APP_ENV=staging \
            -e APP_DEBUG=false \
            -e APP_KEY=base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA= \
            -e APP_URL=https://pilot.bizlife.invalid \
            -e DB_PASSWORD=secret \
            -e REDIS_PASSWORD=secret \
            -e AWS_ACCESS_KEY_ID=test \
            -e AWS_SECRET_ACCESS_KEY=test \
            -e AWS_BUCKET=test \
            -e MAIL_HOST=mail.invalid \
            -e MAIL_FROM_ADDRESS=info@bizlife.invalid \
            -e ENTRYPOINT_SKIP_CACHE=1 \
            bizlife-crm-app:staging-test echo "staging_entrypoint_ok"

          # Production olumlu
          docker run --rm \
            -e APP_ENV=production \
            -e APP_DEBUG=false \
            -e APP_KEY=base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA= \
            -e APP_URL=https://pilot.bizlife.invalid \
            -e DB_PASSWORD=secret \
            -e REDIS_PASSWORD=secret \
            -e AWS_ACCESS_KEY_ID=test \
            -e AWS_SECRET_ACCESS_KEY=test \
            -e AWS_BUCKET=test \
            -e MAIL_HOST=mail.invalid \
            -e MAIL_FROM_ADDRESS=info@bizlife.invalid \
            -e ENTRYPOINT_SKIP_CACHE=1 \
            bizlife-crm-app:staging-test echo "production_entrypoint_ok"

      - name: Build edilmiş app imajında local ve APP_DEBUG=true olumsuz testleri (fail-fast)
        run: |
          # local ortamı reddetmeli
          if docker run --rm \
            -e APP_ENV=local \
            -e APP_DEBUG=false \
            -e APP_KEY=base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA= \
            -e APP_URL=https://pilot.bizlife.invalid \
            -e DB_PASSWORD=secret \
            -e REDIS_PASSWORD=secret \
            -e AWS_ACCESS_KEY_ID=test \
            -e AWS_SECRET_ACCESS_KEY=test \
            -e AWS_BUCKET=test \
            -e MAIL_HOST=mail.invalid \
            -e MAIL_FROM_ADDRESS=info@bizlife.invalid \
            -e ENTRYPOINT_SKIP_CACHE=1 \
            bizlife-crm-app:staging-test echo "should_fail"; then
            echo "HATA: APP_ENV=local reddedilmedi!"
            exit 1
          else
            echo "APP_ENV=local beklendiği gibi reddedildi."
          fi

          # APP_DEBUG=true reddetmeli
          if docker run --rm \
            -e APP_ENV=staging \
            -e APP_DEBUG=true \
            -e APP_KEY=base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA= \
            -e APP_URL=https://pilot.bizlife.invalid \
            -e DB_PASSWORD=secret \
            -e REDIS_PASSWORD=secret \
            -e AWS_ACCESS_KEY_ID=test \
            -e AWS_SECRET_ACCESS_KEY=test \
            -e AWS_BUCKET=test \
            -e MAIL_HOST=mail.invalid \
            -e MAIL_FROM_ADDRESS=info@bizlife.invalid \
            -e ENTRYPOINT_SKIP_CACHE=1 \
            bizlife-crm-app:staging-test echo "should_fail"; then
            echo "HATA: APP_DEBUG=true reddedilmedi!"
            exit 1
          else
            echo "APP_DEBUG=true beklendiği gibi reddedildi."
          fi

      - name: Tünelsiz gerçek staging stack smoke testi
        run: |
          set -e
          trap 'STAGING_ENV_FILE=.env.staging.example DB_PASSWORD=stagingsecret REDIS_PASSWORD=stagingsecret docker compose --env-file .env.staging.example -f compose.staging.yaml -f compose.staging.ci.yaml down -v --remove-orphans || true' EXIT

          echo "1. Staging stack'ini derleyip arka planda başlat..."
          STAGING_ENV_FILE=.env.staging.example DB_PASSWORD=stagingsecret REDIS_PASSWORD=stagingsecret \
            docker compose --env-file .env.staging.example -f compose.staging.yaml -f compose.staging.ci.yaml up -d --build

          echo "2. Migration'ları çalıştır..."
          STAGING_ENV_FILE=.env.staging.example DB_PASSWORD=stagingsecret REDIS_PASSWORD=stagingsecret \
            docker compose --env-file .env.staging.example -f compose.staging.yaml -f compose.staging.ci.yaml exec -T app php artisan migrate --force

          echo "3. Staging provizyon komutunu çalıştır..."
          STAGING_ENV_FILE=.env.staging.example DB_PASSWORD=stagingsecret REDIS_PASSWORD=stagingsecret \
            docker compose --env-file .env.staging.example -f compose.staging.yaml -f compose.staging.ci.yaml exec -T \
            -e STAGING_MARKETING_PASSWORD="PilotPassword123!" \
            -e STAGING_PM_PASSWORD="PilotPassword123!" \
            -e STAGING_COMPANY_AUTHORITY_PASSWORD="PilotPassword123!" \
            -e STAGING_SYSTEM_ADMIN_PASSWORD="PilotPassword123!" \
            app php artisan system:provision-staging-demo

          echo "4. Web container üzerinden HTTP uçlarını doğrula..."
          # /up -> 200
          STAGING_ENV_FILE=.env.staging.example DB_PASSWORD=stagingsecret REDIS_PASSWORD=stagingsecret \
            docker compose --env-file .env.staging.example -f compose.staging.yaml -f compose.staging.ci.yaml exec -T web curl -s -f http://localhost/up >/dev/null
          echo "✓ /up endpointi 200 döndü"

          # /health -> 200 (database, redis, storage hepsi ok)
          HEALTH_JSON=$(STAGING_ENV_FILE=.env.staging.example DB_PASSWORD=stagingsecret REDIS_PASSWORD=stagingsecret \
            docker compose --env-file .env.staging.example -f compose.staging.yaml -f compose.staging.ci.yaml exec -T web curl -s -f http://localhost/health)
          echo "Health yanıtı: ${HEALTH_JSON}"
          echo "${HEALTH_JSON}" | grep -q '"status":"ok"'
          echo "✓ /health endpointi 200 ve status:ok döndü"

          # /robots.txt -> staging noindex ve X-Robots-Tag kontrolü
          ROBOTS_HEADERS=$(STAGING_ENV_FILE=.env.staging.example DB_PASSWORD=stagingsecret REDIS_PASSWORD=stagingsecret \
            docker compose --env-file .env.staging.example -f compose.staging.yaml -f compose.staging.ci.yaml exec -T web curl -s -I http://localhost/robots.txt)
          echo "${ROBOTS_HEADERS}" | grep -i "X-Robots-Tag: noindex, nofollow, noarchive"
          echo "✓ robots.txt üzerinde X-Robots-Tag başlığı doğrulandı"

