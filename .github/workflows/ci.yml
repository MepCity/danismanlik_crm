name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    name: quality
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: tesvik_crm_test
          POSTGRES_USER: tesvik
          POSTGRES_PASSWORD: tesvik
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tesvik -d tesvik_crm_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      APP_ENV: testing
      APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      APP_LOCALE: tr
      APP_TIMEZONE: Europe/Istanbul
      DB_CONNECTION: testing
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_DATABASE_TEST: tesvik_crm_test
      DB_USERNAME: tesvik
      DB_PASSWORD: tesvik
      REDIS_HOST: 127.0.0.1
      REDIS_PORT: 6379

    steps:
      - name: Kodu al
        uses: actions/checkout@v4

      - name: PHP kur
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, intl, pdo_pgsql, redis
          coverage: none

      - name: Composer önbellek dizinini bul
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Composer önbelleğini yükle
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-php-8.4-composer-${{ hashFiles('composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-php-8.4-composer-

      - name: Bağımlılıkları kur
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Pint
        run: vendor/bin/pint --test

      - name: Larastan
        run: vendor/bin/phpstan analyse --memory-limit=512M

      - name: Pest
        run: php artisan test
