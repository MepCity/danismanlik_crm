name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    name: quality
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: tesvik_crm_test
          POSTGRES_USER: tesvik
          POSTGRES_PASSWORD: tesvik
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tesvik -d tesvik_crm_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      mailpit:
        image: axllent/mailpit:latest
        ports:
          - 1025:1025
          - 8025:8025

    env:
      APP_ENV: testing
      APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      APP_LOCALE: tr
      APP_TIMEZONE: Europe/Istanbul
      DB_CONNECTION: testing
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_DATABASE_TEST: tesvik_crm_test
      DB_USERNAME: tesvik
      DB_PASSWORD: tesvik
      REDIS_HOST: 127.0.0.1
      REDIS_PORT: 6379
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin
      AWS_DEFAULT_REGION: us-east-1
      AWS_BUCKET: tesvik-crm
      AWS_USE_PATH_STYLE_ENDPOINT: true
      AWS_ENDPOINT: http://127.0.0.1:9000
      DOCUMENT_DISK: s3
      MAIL_HOST: 127.0.0.1

    steps:
      - name: Kodu al
        uses: actions/checkout@v6

      - name: PHP kur
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, intl, pdo_pgsql, redis, zip
          coverage: none

      - name: MinIO başlat ve kovayı hazırla
        run: |
          docker run --detach --name minio \
            --publish 9000:9000 \
            --env MINIO_ROOT_USER=minioadmin \
            --env MINIO_ROOT_PASSWORD=minioadmin \
            minio/minio:latest server /data
          for attempt in {1..30}; do
            curl --fail --silent http://127.0.0.1:9000/minio/health/ready && break
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:9000/minio/health/ready
          docker run --rm --network host \
            --env MC_HOST_local=http://minioadmin:minioadmin@127.0.0.1:9000 \
            minio/mc:latest mb --ignore-existing local/tesvik-crm

      - name: Node kur
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Ön yüz bağımlılıklarını kur
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Ön yüz varlıklarını derle
        run: npm run build

      - name: Composer önbellek dizinini bul
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Composer önbelleğini yükle
        uses: actions/cache@v5
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-php-8.4-composer-${{ hashFiles('composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-php-8.4-composer-

      - name: Bağımlılıkları kur
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Pint
        run: vendor/bin/pint --test

      - name: Larastan
        run: vendor/bin/phpstan analyse --memory-limit=512M

      - name: Pest
        run: php artisan test
